[package]
name = "kms-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kms-core"
path = "src/main.rs"

[features]
default = ["non-fips"]
non-fips = ["kms-engine/non-fips"]
fips = ["kms-engine/fips"]
pqc = ["kms-engine/pqc"]

[dependencies]
kms-engine.workspace = true
kms-wire.workspace = true
kms-sys.workspace = true
zeroize = "1"

[target.'cfg(windows)'.dev-dependencies]
kms-sys = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
