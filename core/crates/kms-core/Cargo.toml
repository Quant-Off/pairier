[package]
name = "kms-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kms-core"
path = "src/main.rs"

[features]
default = ["non-fips"]
non-fips = ["kms-engine/non-fips"]
fips = ["kms-engine/fips"]
pqc = ["kms-engine/pqc"]

[dependencies]
kms-engine.workspace = true
kms-wire.workspace = true
kms-sys.workspace = true
libc = "0.2"
zeroize = "1"

[lints]
workspace = true
